services:
  postgres:
    image: postgres:15-alpine
    container_name: smart-pricing-db
    environment:
      POSTGRES_DB: smart_pricing_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_pricing_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: